name: publish

# crates.io publishing, same trigger as release.yml (tag vX.Y.Z). `cargo publish
# --workspace` (cargo >= 1.90) resolves dependency order, waits for index propagation
# between crates, and verifies each package against a local overlay of the not-yet-live
# ones — no hand-rolled ordering/sleep loop. memra-probe is publish=false in its
# manifest AND excluded here (dev spike, not part of the published surface).
#
# workflow_dispatch = DRY-RUN ONLY: full package + verify, no upload, no token needed.
# Run it before tagging to catch packaging drift.
#
# Owner setup (docs/RELEASING.md "Publishing to crates.io"): repo secret
# CARGO_REGISTRY_TOKEN = a crates.io API token with publish-new + publish-update scope.
# The publish step fails with a clear message if the secret is missing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "true = REAL publish of the workspace version on this ref (recovery door for a partial tag publish — v0.69.0 shipped 5/9 crates before the new-crate burst limit 429'd). Default false = dry-run."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA 13.1 (nvcc + headers — publish verification compiles the kernels)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-1 cuda-cudart-dev-13-1 libcublas-dev-13-1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-sm120a

      - name: Guard — tag must match workspace version (tag runs only)
        if: github.event_name == 'push'
        run: |
          ws_version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; m=json.load(sys.stdin); print(next(p['version'] for p in m['packages'] if p['name']=='memra-server'))")
          if [ "v$ws_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::workspace version v$ws_version != tag $GITHUB_REF_NAME — bump [workspace.package].version (+ the pinned [workspace.dependencies] versions) before tagging"
            exit 1
          fi

      - name: Dry-run (manual dispatch — no upload)
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        run: cargo publish --workspace --exclude memra-probe --locked --dry-run
        env:
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"

      # Per-crate, dependency order, skip-if-live, 429-aware. `cargo publish --workspace`
      # is all-or-nothing: when the v0.69.0 run 429'd on crates.io's new-crate burst limit
      # mid-batch (5 crates live, 4 not), the rerun hard-failed on "crate already exists"
      # instead of resuming. This loop is resumable: already-published versions skip via
      # the registry API, and a 429 waits out the documented refill (1 new crate/10 min)
      # instead of dying. Order = topological (cargo metadata), memra-probe excluded
      # (publish=false).
      - name: Publish to crates.io (tag runs + dispatch with publish=true)
        if: github.event_name == 'push' || inputs.publish == true
        run: |
          set -o pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set — add a crates.io API token in repo Settings > Secrets (docs/RELEASING.md)"
            exit 1
          fi
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; m=json.load(sys.stdin); print(next(p['version'] for p in m['packages'] if p['name']=='memra-server'))")
          echo "publishing workspace version $version"
          for crate in memra-gguf memra-kv memra-runtime memra-sampling memra-tokenizer \
                       memra-validate memra-engine memra-lanes memra-server; do
            if curl -sf "https://crates.io/api/v1/crates/$crate/$version" \
                 -A "memra-publish-workflow (github.com/avifenesh/memra)" | grep -q '"version"'; then
              echo "$crate@$version already on crates.io — skipping"
              continue
            fi
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if cargo publish -p "$crate" --locked 2>&1 | tee "/tmp/publish-$crate.log"; then
                ok=1; break
              fi
              if grep -q "429 Too Many Requests" "/tmp/publish-$crate.log"; then
                echo "::warning::$crate rate-limited (attempt $attempt/6) — waiting 620s for the new-crate window"
                sleep 620
              else
                echo "::error::$crate failed for a non-rate-limit reason — see log above"
                exit 1
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$crate still rate-limited after 6 attempts"
              exit 1
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          MEMRA_NVCC: /usr/local/cuda-13.1/bin/nvcc
          MEMRA_CUDA_ARCH: "120a"
