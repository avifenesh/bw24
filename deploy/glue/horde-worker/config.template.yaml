# Generated by configure.py. Do not edit the rendered copy.
AiHordeApiKey: @@AI_HORDE_API_KEY@@
workerName: @@WORKER_NAME@@
clusterUrl: @@CLUSTER_URL@@
priorityUsernames: []
workerId: ""
workerInfo: "Step-3.7-Flash research preview served by memra."

serverEngine: "openaicompat"
serverUrl: @@SERVER_URL@@
serverApiKey: @@BACKEND_KEY@@
openaiCompatMode: "text"
llamacppApiMode: "native"
llamacppSlots: "disabled"
llamacppSlotsStrict: "disabled"
llamacppSlotsCacheMs: 1000
serverModel: @@SERVER_MODEL@@

# This is the public AI Horde model name fixed by the trial contract.
model: "memra-research-preview"

# Keep the public worker narrower than the underlying 131k server.
ctx: @@CONTEXT_TOKENS@@
maxLength: @@MAX_OUTPUT_TOKENS@@
responsePrefixFilter: ""
enforceCtxLimit: "enabled"

# One polling/generation lane prevents the bridge from bypassing admission intent.
threads: @@THREADS@@
threadPollStagger: "enabled"
timeout: @@TIMEOUT_SECONDS@@
refreshTime: @@REFRESH_MILLISECONDS@@

UI:
  layout: "vertical"
  showBridgeStats: "enabled"
  showThreadActivity: "enabled"
  showAiHordeUser: "enabled"
  showAiHordePerformance: "enabled"
  showRecentJobs: "enabled"
  recentJobsCount: 5

nsfw: @@NSFW_MODE@@
enableCsamFilter: "regex"
csamPositiveAction: "respond"
csamResponseDelayMs: 5000
csamBlockedResponse: "This worker cannot process that request."
chat_template_kwargs: {}
csamMetadataRef: "local regex prefilter"
openaiModerationMaxTokens: 10000
openaiApiKey: ""

# Prompt and bridge log files stay disabled. Service events go to journald.
maxTps: ""
uiTheme: "monochrome"
outputPrompt: ""
logFile: ""
