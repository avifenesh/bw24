[package]
name = "memra-engine"
version = "0.0.0"
edition = "2024"

[dependencies]
memra-sampling = { path = "../memra-sampling" }
memra-validate = { path = "../memra-validate" }
memra-kv = { path = "../memra-kv" }
memra-gguf = { path = "../memra-gguf" }
memra-runtime = { path = "../memra-runtime" }
memra-tokenizer = { path = "../memra-tokenizer" }
cudarc = { version = "0.19", default-features = false, features = ["std", "cuda-13010", "dynamic-loading", "driver", "cublas", "cublaslt", "nvrtc"] }
memmap2 = "0.9"
libc = "0.2"

